<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ling - Pelican Riding a Bicycle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 60%, #A5D6A7 60%, #66BB6A 100%);
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }
  .scene {
    position: relative;
    width: 100%;
    height: 80%;
  }
  .ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 40%;
    background: #8D6E63;
    border-top: 4px solid #6D4C41;
  }
  .ground::before {
    content: '';
    position: absolute;
    top: -4px;
    width: 100%;
    height: 4px;
    background: #4CAF50;
  }
  .sun {
    position: absolute;
    top: 30px;
    right: 80px;
    width: 70px;
    height: 70px;
    background: radial-gradient(circle, #FFD54F, #FF8F00);
    border-radius: 50%;
    box-shadow: 0 0 40px #FFD54F, 0 0 80px rgba(255,213,79,0.4);
    animation: sunPulse 3s ease-in-out infinite;
  }
  @keyframes sunPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px #FFD54F, 0 0 80px rgba(255,213,79,0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 60px #FFD54F, 0 0 100px rgba(255,213,79,0.6); }
  }
  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.9;
  }
  .cloud1 { top: 50px; left: 10%; width: 120px; height: 40px; animation: cloudMove 20s linear infinite; }
  .cloud2 { top: 30px; left: 55%; width: 80px; height: 30px; animation: cloudMove 25s linear infinite; }
  .cloud3 { top: 70px; left: 35%; width: 100px; height: 35px; animation: cloudMove 30s linear infinite; }
  @keyframes cloudMove {
    0% { transform: translateX(-200px); }
    100% { transform: translateX(calc(100vw + 200px)); }
  }
  .bicycle-container {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%);
    animation: bikeMove 4s linear infinite;
  }
  @keyframes bikeMove {
    0% { left: 50%; transform: translateX(-120%); }
    100% { left: 50%; transform: translateX(20%); }
  }
  .bicycle {
    position: relative;
    width: 280px;
    height: 180px;
  }
  .wheel {
    position: absolute;
    width: 60px;
    height: 60px;
    border: 5px solid #333;
    border-radius: 50%;
    background: #ddd;
  }
  .wheel::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 4px;
    height: 4px;
    background: #333;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .wheel::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100%;
    height: 2px;
    background: #999;
    transform-origin: center;
    animation: wheelSpin 0.5s linear infinite;
  }
  .wheel-back {
    bottom: 0;
    left: 20px;
  }
  .wheel-back::before {
    animation: wheelSpin 0.5s linear infinite;
  }
  .wheel-front {
    bottom: 0;
    right: 20px;
  }
  .wheel-front::before {
    animation: wheelSpin 0.5s linear infinite;
  }
  @keyframes wheelSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .frame {
    position: absolute;
    bottom: 25px;
    left: 45px;
    width: 190px;
    height: 100px;
  }
  .frame-top {
    position: absolute;
    top: 0;
    left: 30px;
    width: 4px;
    height: 70px;
    background: #E53935;
    transform: rotate(-15deg);
    transform-origin: bottom center;
  }
  .frame-down {
    position: absolute;
    top: 35px;
    left: 30px;
    width: 4px;
    height: 55px;
    background: #E53935;
    transform: rotate(10deg);
    transform-origin: top center;
  }
  .frame-horizontal {
    position: absolute;
    top: 30px;
    left: 30px;
    width: 130px;
    height: 4px;
    background: #E53935;
    transform: rotate(-5deg);
  }
  .frame-seat {
    position: absolute;
    top: 5px;
    left: 25px;
    width: 30px;
    height: 6px;
    background: #5D4037;
    border-radius: 3px;
    transform: rotate(-15deg);
  }
  .handlebar {
    position: absolute;
    top: 8px;
    right: 0;
    width: 4px;
    height: 30px;
    background: #333;
    transform: rotate(-15deg);
    transform-origin: bottom center;
  }
  .handlebar::after {
    content: '';
    position: absolute;
    top: -8px;
    left: -6px;
    width: 16px;
    height: 4px;
    background: #333;
    border-radius: 2px;
  }
  .pedal-crank {
    position: absolute;
    bottom: 30px;
    left: 60px;
    width: 4px;
    height: 30px;
    background: #888;
    transform-origin: top center;
    animation: pedalRotate 1s linear infinite;
  }
  .pedal-crank::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: -5px;
    width: 14px;
    height: 4px;
    background: #888;
    border-radius: 2px;
  }
  .pedal {
    position: absolute;
    bottom: 27px;
    left: 55px;
    width: 4px;
    height: 14px;
    background: #666;
    transform-origin: top center;
    animation: pedalRotate 1s linear infinite;
  }
  .pedal::after {
    content: '';
    position: absolute;
    bottom: -3px;
    left: -5px;
    width: 14px;
    height: 4px;
    background: #666;
    border-radius: 2px;
  }
  @keyframes pedalRotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .pelican {
    position: absolute;
    top: -60px;
    left: 90px;
    animation: pelicanBob 0.8s ease-in-out infinite;
  }
  @keyframes pelicanBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .pelican-body {
    position: relative;
    width: 80px;
    height: 60px;
  }
  .pelican-chest {
    position: absolute;
    bottom: 0;
    left: 10px;
    width: 50px;
    height: 40px;
    background: white;
    border-radius: 25px 25px 10px 10px;
  }
  .pelican-head {
    position: absolute;
    top: -10px;
    left: 15px;
    width: 45px;
    height: 35px;
    background: white;
    border-radius: 50% 50% 45% 45%;
  }
  .pelican-head::before {
    content: '';
    position: absolute;
    top: 12px;
    left: 38px;
    width: 22px;
    height: 8px;
    background: #FF8F00;
    border-radius: 0 50% 50% 0;
    transform: rotate(-10deg);
  }
  .pelican-head::after {
    content: '';
    position: absolute;
    top: 17px;
    left: 42px;
    width: 10px;
    height: 6px;
    background: #333;
    border-radius: 50%;
  }
  .pelican-eye {
    position: absolute;
    top: 8px;
    left: 22px;
    width: 8px;
    height: 8px;
    background: #333;
    border-radius: 50%;
  }
  .pelican-eye::after {
    content: '';
    position: absolute;
    top: 1px;
    left: 1px;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
  }
  .pelican-wing {
    position: absolute;
    top: 5px;
    left: 5px;
    width: 40px;
    height: 25px;
    background: #37474F;
    border-radius: 50% 50% 30% 30%;
    transform-origin: right center;
    animation: wingFlap 0.4s ease-in-out infinite alternate;
  }
  @keyframes wingFlap {
    0% { transform: rotate(-15deg); }
    100% { transform: rotate(15deg); }
  }
  .pelican-leg-left {
    position: absolute;
    bottom: -15px;
    left: 25px;
    width: 3px;
    height: 25px;
    background: #FF8F00;
    transform-origin: top center;
    animation: legPedal 1s linear infinite;
  }
  .pelican-leg-left::after {
    content: '';
    position: absolute;
    bottom: -3px;
    left: -3px;
    width: 9px;
    height: 3px;
    background: #FF8F00;
    border-radius: 2px;
  }
  .pelican-leg-right {
    position: absolute;
    bottom: -15px;
    left: 40px;
    width: 3px;
    height: 25px;
    background: #FF8F00;
    transform-origin: top center;
    animation: legPedal 1s linear infinite reverse;
  }
  .pelican-leg-right::after {
    content: '';
    position: absolute;
    bottom: -3px;
    left: -3px;
    width: 9px;
    height: 3px;
    background: #FF8F00;
    border-radius: 2px;
  }
  @keyframes legPedal {
    0% { transform: rotate(-30deg); }
    50% { transform: rotate(30deg); }
    100% { transform: rotate(-30deg); }
  }
  .pelican-tail {
    position: absolute;
    top: 5px;
    right: -15px;
    width: 25px;
    height: 12px;
    background: #37474F;
    border-radius: 0 50% 50% 0;
    transform: rotate(-10deg);
  }
  .pelican-feet {
    position: absolute;
    bottom: -2px;
    left: 20px;
    width: 45px;
    height: 5px;
  }
  .pelican-feet::before,
  .pelican-feet::after {
    content: '';
    position: absolute;
    bottom: 0;
    width: 8px;
    height: 3px;
    background: #FF8F00;
    border-radius: 50%;
  }
  .pelican-feet::before { left: 0; }
  .pelican-feet::after { right: 0; }
  .title {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Comic Sans MS', cursive, sans-serif;
    font-size: 28px;
    font-weight: bold;
    color: #333;
    text-shadow: 2px 2px 0px rgba(255,255,255,0.7);
    z-index: 10;
  }
  .bird {
    position: absolute;
    font-size: 20px;
    animation: birdFly 6s linear infinite;
  }
  .bird1 { top: 20%; left: 5%; animation-delay: 0s; }
  .bird2 { top: 15%; left: 40%; animation-delay: 2s; font-size: 16px; }
  .bird3 { top: 25%; left: 70%; animation-delay: 4s; font-size: 14px; }
  .bird4 { top: 10%; left: 85%; animation-delay: 1s; font-size: 18px; }
  @keyframes birdFly {
    0% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(100px, -20px) rotate(5deg); }
    50% { transform: translate(200px, 10px) rotate(-3deg); }
    75% { transform: translate(300px, -15px) rotate(2deg); }
    100% { transform: translate(400px, 0) rotate(0deg); opacity: 0; }
  }
  .dust {
    position: absolute;
    width: 4px;
    height: 4px;
    background: rgba(139,90,43,0.5);
    border-radius: 50%;
    animation: dustMove 1s linear infinite;
  }
  .dust1 { bottom: 22%; left: 40%; animation-delay: 0s; }
  .dust2 { bottom: 21%; left: 43%; animation-delay: 0.3s; }
  .dust3 { bottom: 22%; left: 46%; animation-delay: 0.6s; }
  .dust4 { bottom: 21%; left: 39%; animation-delay: 0.9s; }
  .dust5 { bottom: 22%; left: 47%; animation-delay: 1.2s; }
  @keyframes dustMove {
    0% { transform: translateY(0) translateX(0); opacity: 1; }
    100% { transform: translateY(-30px) translateX(20px); opacity: 0; }
  }
  .tree {
    position: absolute;
    bottom: 40%;
  }
  .tree1 { left: 5%; }
  .tree2 { left: 92%; }
  .tree-trunk {
    width: 12px;
    height: 60px;
    background: #5D4037;
    margin: 0 auto;
    border-radius: 2px;
  }
  .tree-top {
    width: 50px;
    height: 40px;
    background: #388E3C;
    border-radius: 50% 50% 50% 50%;
    position: relative;
    bottom: 35px;
    left: -19px;
  }
  .tree-top2 {
    width: 40px;
    height: 35px;
    background: #2E7D32;
    border-radius: 50%;
    position: relative;
    bottom: 55px;
    left: -14px;
  }
  .sign {
    position: absolute;
    bottom: 38%;
    left: 55%;
    font-family: 'Comic Sans MS', cursive;
    font-size: 14px;
    color: #fff;
    background: #E53935;
    padding: 4px 12px;
    border-radius: 4px;
    border: 2px solid #333;
    transform: rotate(-5deg);
    white-space: nowrap;
    animation: signSwing 2s ease-in-out infinite alternate;
  }
  @keyframes signSwing {
    0% { transform: rotate(-8deg); }
    100% { transform: rotate(3deg); }
  }
</style>
</head>
<body>
