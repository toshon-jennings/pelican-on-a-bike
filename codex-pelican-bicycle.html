<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A playful animated pelican riding a bicycle along a sunny coastal road.">
  <title>Pelican on a Bicycle - ChatGPT 5.6 Luna</title>
  <style>
    :root {
      --paper: #f7f1e3;
      --ink: #073b35;
      --sea: #7ec8be;
      --sea-dark: #266c68;
      --sky: #a9dce2;
      --coral: #e8583e;
      --sun: #f5b82e;
      --road: #263b3b;
      --white: #fbfaf4;
      --pob-nav-h: 64px;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      position: relative;
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 20%, rgba(7, 59, 53, .05) 0 1px, transparent 1.5px),
        radial-gradient(circle at 70% 70%, rgba(232, 88, 62, .04) 0 1px, transparent 1.5px),
        var(--paper);
      background-size: 13px 15px, 19px 21px;
      font-family: "DM Sans", "Avenir Next", system-ui, sans-serif;
      overflow: hidden;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(220px, .7fr) minmax(0, 1.3fr);
      align-items: center;
      gap: clamp(1.5rem, 5vw, 5rem);
      width: min(calc(100% - 3rem), 1440px);
      min-height: calc(100svh - var(--pob-nav-h));
      margin: 0 auto;
      padding: clamp(2rem, 5vw, 5rem) 0;
    }

    .intro {
      position: relative;
      z-index: 2;
      padding-bottom: 2rem;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 1.2rem;
      padding: .55rem .8rem .48rem;
      border: 2px solid var(--ink);
      background: var(--sun);
      font: 700 .72rem/1 "Arial Narrow", Impact, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
      transform: rotate(-2deg);
    }

    h1 {
      max-width: 6ch;
      margin: 0;
      font: 700 clamp(4.5rem, 10vw, 9rem)/.82 "Arial Narrow", Impact, sans-serif;
      letter-spacing: -.07em;
      text-transform: uppercase;
    }

    .intro::after {
      display: block;
      width: min(100%, 19rem);
      height: 5px;
      margin: 1.5rem 0 1.2rem;
      content: "";
      background: var(--coral);
      transform: rotate(-1deg);
    }

    .intro p {
      max-width: 28rem;
      margin: 0;
      font: 600 clamp(1.05rem, 1.7vw, 1.35rem)/1.42 Georgia, serif;
    }

    .pause {
      display: inline-flex;
      align-items: center;
      gap: .65rem;
      margin-top: 1.6rem;
      padding: .85rem 1rem;
      border: 2px solid var(--ink);
      color: var(--paper);
      background: var(--ink);
      box-shadow: 4px 4px 0 var(--coral);
      cursor: pointer;
      font: 700 .85rem/1 "Arial Narrow", Impact, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .pause:hover, .pause:focus-visible {
      box-shadow: 1px 1px 0 var(--coral);
      transform: translate(3px, 3px);
    }

    .pause svg { width: 1rem; height: 1rem; fill: currentColor; }

    .stage {
      position: relative;
      min-width: 0;
      aspect-ratio: 1.45;
      border: 3px solid var(--ink);
      border-radius: 26px;
      overflow: hidden;
      background: var(--sky);
      box-shadow: 12px 14px 0 rgba(7, 59, 53, .12);
      isolation: isolate;
    }

    .sky, .sun, .cloud, .hills, .road, .motion-lines, .ride { position: absolute; }

    .sky {
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.34), transparent 48%),
        linear-gradient(180deg, #8dcfdd 0%, #c7e9e4 67%, #e5edc9 100%);
    }

    .sun {
      top: 9%;
      right: 10%;
      width: clamp(6rem, 14vw, 10rem);
      aspect-ratio: 1;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 10px 10px 0 rgba(7,59,53,.1);
      animation: sun-pulse 5s ease-in-out infinite alternate;
    }

    .cloud {
      width: 9rem;
      height: 1.8rem;
      border-radius: 99px;
      background: rgba(255,255,255,.76);
      animation: cloud-drift 30s linear infinite;
    }

    .cloud::before, .cloud::after {
      position: absolute;
      bottom: 0;
      content: "";
      border-radius: 50% 50% 0 0;
      background: inherit;
    }

    .cloud::before { left: 18%; width: 3.4rem; height: 3.4rem; }
    .cloud::after { right: 16%; width: 2.8rem; height: 2.8rem; }
    .cloud.one { top: 18%; left: 64%; }
    .cloud.two { top: 33%; left: 8%; width: 6rem; opacity: .55; animation-duration: 42s; animation-delay: -16s; }

    .hills {
      right: -5%;
      bottom: 27%;
      left: -5%;
      height: 30%;
      background:
        radial-gradient(65% 110% at 20% 100%, #80b980 0 32%, transparent 33%),
        radial-gradient(65% 110% at 54% 100%, #6da876 0 33%, transparent 34%),
        radial-gradient(65% 110% at 88% 100%, #5d9271 0 31%, transparent 32%);
    }

    .road {
      right: -5%;
      bottom: 0;
      left: -5%;
      height: 31%;
      border-top: 3px solid var(--ink);
      background: var(--road);
    }

    .road::before {
      position: absolute;
      top: 1.4rem;
      right: 0;
      left: 0;
      height: .55rem;
      content: "";
      background: repeating-linear-gradient(90deg, var(--sun) 0 5rem, transparent 5rem 11rem);
      animation: road-move .75s linear infinite;
    }

    .motion-lines { right: 4%; bottom: 42%; left: 5%; height: 30%; pointer-events: none; }
    .motion-lines i { position: absolute; right: 0; display: block; width: 5rem; height: 3px; background: rgba(255,255,255,.75); animation: streak 1s linear infinite; }
    .motion-lines i:nth-child(1) { top: 25%; width: 8rem; }
    .motion-lines i:nth-child(2) { top: 50%; animation-delay: -.3s; }
    .motion-lines i:nth-child(3) { top: 74%; width: 3rem; animation-delay: -.65s; }

    .ride {
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 14px 4px rgba(7,59,53,.18));
    }

    .wheel, .crank { transform-box: fill-box; transform-origin: center; }
    .wheel { animation: spin 1s linear infinite; }
    .crank { animation: spin 1s linear infinite reverse; }
    .bike-rider { transform-box: view-box; transform-origin: 580px 500px; animation: ride-bob .55s ease-in-out infinite alternate; }
    .wing { transform-box: view-box; transform-origin: 560px 360px; animation: flap 1.2s ease-in-out infinite alternate; }
    .scarf { transform-box: view-box; transform-origin: 525px 290px; animation: scarf-wave .7s ease-in-out infinite alternate; }
    .pedal-leg { transform-box: view-box; transform-origin: 545px 458px; animation: pedal 1s ease-in-out infinite; }
    .pedal-leg.back { animation-delay: -.5s; }

    .scene-note {
      position: absolute;
      right: 1rem;
      bottom: 1rem;
      z-index: 3;
      padding: .55rem .7rem;
      border: 2px solid var(--ink);
      background: rgba(247,241,227,.86);
      font: 700 .7rem/1 "Arial Narrow", Impact, sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .is-paused *, .is-paused *::before, .is-paused *::after { animation-play-state: paused !important; }

    :focus-visible { outline: 3px solid var(--sun); outline-offset: 4px; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ride-bob { from { transform: translateY(0) rotate(-.4deg); } to { transform: translateY(-5px) rotate(.4deg); } }
    @keyframes flap { from { transform: rotate(-1deg); } to { transform: rotate(5deg); } }
    @keyframes pedal { 0%, 100% { transform: rotate(15deg); } 50% { transform: rotate(-15deg); } }
    @keyframes scarf-wave { from { transform: rotate(-4deg) skewX(0); } to { transform: rotate(5deg) skewX(8deg); } }
    @keyframes sun-pulse { to { transform: scale(1.05); } }
    @keyframes cloud-drift { from { transform: translateX(34vw); } to { transform: translateX(-50vw); } }
    @keyframes road-move { to { background-position: -11rem 0; } }
    @keyframes streak { 0% { transform: translateX(10rem); opacity: 0; } 20% { opacity: .8; } 100% { transform: translateX(-30rem); opacity: 0; } }

    @media (max-width: 800px) {
      body { overflow: auto; }
      .page { grid-template-columns: 1fr; gap: 1rem; padding: 2rem 0 7rem; }
      .intro { padding: 0; }
      .eyebrow { margin-bottom: .8rem; }
      h1 { max-width: none; font-size: clamp(4rem, 17vw, 7rem); }
      .intro::after { margin: 1rem 0; }
      .intro p { max-width: 33rem; }
      .stage { width: 100%; aspect-ratio: 1.25; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro" aria-labelledby="title">
      <span class="eyebrow">ChatGPT 5.6 Luna presents</span>
      <h1 id="title">Pelican<br>on a<br>bike</h1>

            </g>

          <g fill="none" stroke="url(#frame)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
            <path d="M510 525 285 525M510 525 425 430M285 525l140-95M510 525l115-105M425 430h200M625 420l110 105"/>

  <script>
    (() => {
      const button = document.querySelector('.pause');
      const page = document.body;
      const label = button.querySelector('span');
      const icon = button.querySelector('path');

      button.addEventListener('click', () => {
        const paused = page.classList.toggle('is-paused');
        button.setAttribute('aria-pressed', String(paused));
        label.textContent = paused ? 'Resume ride' : 'Pause ride';
        icon.setAttribute('d', paused ? 'M8 5v14l11-7z' : 'M7 5h3v14H7zm7 0h3v14h-3z');
      });
    })();
  </script>

  <style>
    /* Shared gallery navigation. Keep the scene above the fixed bar. */

    .pob-nav a:hover, .pob-nav a:focus-visible { background: rgba(255,255,255,.25); }
    .pob-nav-step { padding: 8px 16px; font-size: 14px; white-space: nowrap; }
    .pob-nav-home { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 112px; padding: 6px 16px; font-size: 13px; font-weight: 600; letter-spacing: .5px; text-align: center; }
    .pob-nav-home small { color: rgba(255,255,255,.65); font-size: 9px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; }
    @media (max-width: 520px) { .pob-nav { padding: 0 10px; } .pob-nav-step { padding: 8px 10px; font-size: 12px; } .pob-nav-home { min-width: 96px; padding-inline: 8px; } }
  </style>
  <nav class="pob-nav" aria-label="Gallery navigation">

  </nav>

    (() => {
      var pages = [
        "bigpickle-pelican-bike.html",
        "chatgpt-5.4-mini-pelican-bicycle.html",
        "codex-pelican-bicycle.html",
        "claude-opus-5-pelican-bicycle.html",

        "composer-2.5-fast-pelican-bicycle.html",

        "gemini-3-6-flash-pelican-bicycle.html",
        "glm-5.1-pelican-bicycle.html",
        "kimi-k2.7-pelican-bike.html",

        "minimax-m3-pelican-bicycle.html",

        "northminicode-pelican-bicycle.html",
        "qwen-3.5-397b-a17b-pelican-bicycle.html"

      const current = window.location.pathname.split('/').pop();
      const index = Math.max(0, pages.indexOf(current));
      document.getElementById('prevBtn').href = pages[(index - 1 + pages.length) % pages.length];
      document.getElementById('nextBtn').href = pages[(index + 1) % pages.length];
    })();
  </script>
