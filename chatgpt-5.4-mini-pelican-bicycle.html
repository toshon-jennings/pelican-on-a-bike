<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pelican on a Bicycle - ChatGPT-5.4 Mini</title>
  <style>
    :root {
      --paper: #f7f1e5;
      --ink: #10262b;
      --sea: #71c7c0;
      --sea-deep: #2d8a91;
      --sun: #ffd76d;
      --coral: #ff7b5e;
      --road: #3e444f;
      --road-dark: #2d333c;
      --frame: #e74c3c;
      --chrome: #d3dae1;
      --shadow: rgba(9, 24, 30, 0.22);
      --panel: rgba(247, 241, 229, 0.82);
      --max: 1240px;
      --body: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      --display: "Arial Narrow", "Trebuchet MS", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      min-width: 320px;
      overflow: hidden;
      font-family: var(--body);
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 255, 255, 0.7) 0 3px, transparent 4px),
        radial-gradient(circle at 78% 18%, rgba(255, 255, 255, 0.5) 0 2px, transparent 3px),
        linear-gradient(180deg, #7fd0e7 0%, #c8eef3 48%, #e8f5dd 72%, #f4e6ba 100%);
    }

    body::before {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.07) 0 1px, transparent 1.5px),
        radial-gradient(circle at 60% 70%, rgba(16, 38, 43, 0.03) 0 1px, transparent 1.5px);
      background-size: 14px 14px, 18px 18px;
      mix-blend-mode: multiply;
      opacity: 0.55;
    }

    .scene {
      position: relative;
      display: grid;
      place-items: center;
      min-height: calc(100svh - var(--pob-nav-h));
      padding: clamp(1rem, 2.5vw, 2rem);
    }

    .badge {
      position: absolute;
      top: clamp(1rem, 2.2vw, 1.6rem);
      left: clamp(1rem, 2.2vw, 1.6rem);
      z-index: 3;
      display: inline-flex;
      flex-direction: column;
      gap: 0.2rem;
      padding: 0.9rem 1rem 0.85rem;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--panel);
      box-shadow: 0 10px 30px var(--shadow);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }

    .badge span:first-child {
      font-size: 0.68rem;
      font-weight: 700;
      opacity: 0.72;
    }

    .badge strong {
      font: 800 clamp(1rem, 1.3vw, 1.2rem) / 1 var(--display);
      letter-spacing: 0.08em;
    }

    .stage {
      position: relative;
      width: min(calc(100vw - 2rem), var(--max));
      height: min(calc(calc(100svh - var(--pob-nav-h)) - 8rem), 760px);
      border: 3px solid var(--ink);
      border-radius: 32px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0)),
        linear-gradient(180deg, #9adbe7 0%, #d7f2f6 54%, #eaf4d8 100%);
      box-shadow: 0 28px 60px rgba(9, 24, 30, 0.18);
    }

    .horizon {
      position: absolute;
      inset: auto -8% 24% -8%;
      height: 28%;
      background:
        radial-gradient(60% 80% at 18% 100%, #8dcf87 0 25%, transparent 26%),
        radial-gradient(52% 75% at 52% 100%, #7ab87d 0 25%, transparent 26%),
        radial-gradient(44% 72% at 86% 100%, #699f76 0 23%, transparent 24%);
      opacity: 0.92;
      filter: saturate(0.95);
    }

    .cloud {
      position: absolute;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      animation: drift linear infinite;
      filter: blur(0.15px);
    }

    .cloud::before,
    .cloud::after {
      position: absolute;
      content: "";
      border-radius: 999px;
      background: inherit;
    }

    .cloud.one {
      top: 12%;
      left: 110%;
      width: 150px;
      height: 44px;
      animation-duration: 52s;
    }

    .cloud.one::before {
      top: -26px;
      left: 20px;
      width: 62px;
      height: 62px;
    }

    .cloud.one::after {
      top: -18px;
      left: 76px;
      width: 48px;
      height: 48px;
    }

    .cloud.two {
      top: 26%;
      left: 118%;
      width: 114px;
      height: 32px;
      opacity: 0.76;
      animation-duration: 74s;
      animation-delay: -24s;
    }

    .cloud.two::before {
      top: -20px;
      left: 14px;
      width: 52px;
      height: 52px;
    }

    .cloud.two::after {
      top: -14px;
      left: 56px;
      width: 38px;
      height: 38px;
    }

    .cloud.three {
      top: 8%;
      left: 130%;
      width: 96px;
      height: 28px;
      opacity: 0.62;
      animation-duration: 88s;
      animation-delay: -58s;
    }

    .cloud.three::before {
      top: -18px;
      left: 10px;
      width: 40px;
      height: 40px;
    }

    .cloud.three::after {
      top: -12px;
      left: 46px;
      width: 32px;
      height: 32px;
    }

    @keyframes drift {
      to {
        transform: translateX(-240vw);
      }
    }

    .sun {
      position: absolute;
      top: 7%;
      right: 8%;
      width: clamp(96px, 12vw, 170px);
      aspect-ratio: 1;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 30%, #fff7d0 0 18%, #ffe28d 19% 54%, #f7b82f 55% 100%);
      box-shadow: 10px 10px 0 rgba(16, 38, 43, 0.08);
      animation: pulse 4.8s ease-in-out infinite;
    }

    @keyframes pulse {
      50% {
        transform: scale(1.03);
        box-shadow: 16px 16px 0 rgba(16, 38, 43, 0.09);
      }
    }

    .ground {
      position: absolute;
      inset: auto 0 0 0;
      height: 31%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0)),
        linear-gradient(180deg, var(--road) 0%, var(--road-dark) 100%);
      border-top: 3px solid var(--ink);
    }

    .road-edge {
      position: absolute;
      inset: 0 0 auto 0;
      height: 12px;
      background: rgba(255, 255, 255, 0.38);
    }

    .road-dashes {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 19%;
      height: 11px;
      background: repeating-linear-gradient(90deg, rgba(255, 215, 109, 0.96) 0 92px, transparent 92px 210px);
      animation: road 0.72s linear infinite;
    }

    @keyframes road {
      to {
        background-position: -210px 0;
      }
    }

    .motion-lines {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 29%;
      height: 52%;
      pointer-events: none;
    }

    .motion-lines span {
      position: absolute;
      display: block;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.9));
      animation: streak 0.95s linear infinite;
    }

    .motion-lines span:nth-child(1) {
      top: 48%;
      left: 62%;
      width: 140px;
    }

    .motion-lines span:nth-child(2) {
      top: 39%;
      left: 72%;
      width: 100px;
      animation-delay: -0.32s;
      opacity: 0.7;
    }

    .motion-lines span:nth-child(3) {
      top: 58%;
      left: 69%;
      width: 76px;
      animation-delay: -0.58s;
      opacity: 0.55;
    }

    @keyframes streak {
      0% {
        transform: translateX(35vw);
        opacity: 0;
      }
      14% {
        opacity: 0.85;
      }
      100% {
        transform: translateX(-36vw);
        opacity: 0;
      }
    }

    .ride {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 18px 14px rgba(16, 38, 43, 0.18));
    }

    .titlecard {
      position: absolute;
      left: clamp(1rem, 2.5vw, 1.6rem);
      bottom: clamp(1rem, 2.5vw, 1.6rem);
      z-index: 3;
      max-width: min(46ch, 60vw);
      padding: 1rem 1.1rem 1.05rem;
      border: 2px solid var(--ink);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(9, 24, 30, 0.14);
    }

    .titlecard h1 {
      margin-bottom: 0.4rem;
      font: 800 clamp(1.45rem, 2.6vw, 2.35rem) / 0.96 var(--display);
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .titlecard p {
      max-width: 38ch;
      font: 600 clamp(0.95rem, 1.3vw, 1.08rem) / 1.45 var(--body);
    }

    .titlecard strong {
      color: var(--sea-deep);
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .scene {
        padding-top: 4.6rem;
        padding-bottom: 8.6rem;
      }

      .stage {
        height: min(68svh, 640px);
        border-radius: 24px;
      }

      .titlecard {
        left: 1rem;
        right: 1rem;
        bottom: 5.8rem;
        max-width: none;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

      var crankCenter = { x: 545, y: 558 };
      var crankRadius = 24;
      var upper = 75;
      var lower = 70;
      var cadence = Math.PI * 2 * 1.4;

      function solveLeg(hip, foot, bend) {
        var dx = foot.x - hip.x;
        var dy = foot.y - hip.y;
        var dist = Math.max(1, Math.hypot(dx, dy));
        var limit = Math.min(dist, upper + lower - 1.5);
        var ux = dx / dist;
        var uy = dy / dist;
        var base = (limit * limit + upper * upper - lower * lower) / (2 * limit);
        var height = Math.sqrt(Math.max(0, upper * upper - base * base));
        var kneeX = hip.x + ux * base + uy * height * bend;
        var kneeY = hip.y + uy * base - ux * height * bend;
        return { x: kneeX, y: kneeY };
      }

      function pointOnCrank(angle) {
        return {
          x: crankCenter.x + Math.cos(angle) * crankRadius,
          y: crankCenter.y + Math.sin(angle) * crankRadius
        };
      }

      function setLine(line, x1, y1, x2, y2) {
        line.setAttribute('x1', x1.toFixed(2));
        line.setAttribute('y1', y1.toFixed(2));
        line.setAttribute('x2', x2.toFixed(2));
        line.setAttribute('y2', y2.toFixed(2));
      }

      function draw(t) {
        var wheelRotation = t * 255;
        var crankRotation = t * 360 * 1.4;
        var bob = Math.sin(t * 5.2) * 7;
        var lean = Math.sin(t * 4.9) * 1.8;

        rig.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');

        wheelFront.setAttribute('transform', 'rotate(' + wheelRotation.toFixed(2) + ' 730 560)');
        chainring.setAttribute('transform', 'rotate(' + crankRotation.toFixed(2) + ' 545 558)');
        tail.setAttribute('transform', 'rotate(' + (Math.sin(t * 4.8) * 2.2).toFixed(2) + ' 430 405)');
        body.setAttribute('transform', 'rotate(' + (Math.sin(t * 3.8) * 1.1).toFixed(2) + ' 548 430)');
        neck.setAttribute('transform', 'rotate(' + lean.toFixed(2) + ' 594 376)');
        headGroup.setAttribute('transform', 'translate(0 ' + (Math.sin(t * 5.6) * 1.4).toFixed(2) + ') rotate(' + (lean * 0.8).toFixed(2) + ' 708 260)');
        wingNear.setAttribute('transform', 'rotate(' + (Math.sin(t * 4.1) * 2.6).toFixed(2) + ' 548 400)');
        wingFar.setAttribute('transform', 'rotate(' + (Math.sin(t * 4.1 + 0.4) * 1.8).toFixed(2) + ' 566 384)');
        pouch.setAttribute('transform', 'translate(0 ' + (Math.sin(t * 7.0) * 1.6).toFixed(2) + ')');
        scarf.setAttribute('d',
          'M544 350 ' +
          'Q491 ' + (350 + Math.sin(t * 5.1) * 6).toFixed(2) + ' 437 ' + (346 + Math.sin(t * 4.4) * 8).toFixed(2) + ' ' +
          'Q385 ' + (344 + Math.sin(t * 4.8 + 1.1) * 11).toFixed(2) + ' 348 ' + (348 + Math.sin(t * 5.3 + 0.7) * 9).toFixed(2));

        var phaseBack = t * cadence + Math.PI;
        var phaseFront = t * cadence;
        var backFootPoint = pointOnCrank(phaseBack);
        var frontFootPoint = pointOnCrank(phaseFront);
        var backKneePoint = solveLeg({ x: 480, y: 438 }, backFootPoint, 1);
        var frontKneePoint = solveLeg({ x: 500, y: 446 }, frontFootPoint, 1);

        setLine(backThigh, 480, 438, backKneePoint.x, backKneePoint.y);
        setLine(backShin, backKneePoint.x, backKneePoint.y, backFootPoint.x, backFootPoint.y);
        backKnee.setAttribute('cx', backKneePoint.x.toFixed(2));
        backKnee.setAttribute('cy', backKneePoint.y.toFixed(2));
        backFoot.setAttribute('transform', 'translate(' + backFootPoint.x.toFixed(2) + ' ' + backFootPoint.y.toFixed(2) + ') rotate(' + (Math.sin(phaseBack) * 10).toFixed(2) + ')');

        setLine(frontThigh, 500, 446, frontKneePoint.x, frontKneePoint.y);
        setLine(frontShin, frontKneePoint.x, frontKneePoint.y, frontFootPoint.x, frontFootPoint.y);
        frontKnee.setAttribute('cx', frontKneePoint.x.toFixed(2));
        frontKnee.setAttribute('cy', frontKneePoint.y.toFixed(2));
        frontFoot.setAttribute('transform', 'translate(' + frontFootPoint.x.toFixed(2) + ' ' + frontFootPoint.y.toFixed(2) + ') rotate(' + (Math.sin(phaseFront) * 10).toFixed(2) + ')');
      }

      if (reduced) {
        draw(0.9);
        return;
      }

      var start = 0;
      function step(now) {
        if (!start) {
          start = now;
        }
        draw((now - start) / 1000);
        requestAnimationFrame(step);
      }

      requestAnimationFrame(step);
    })();
  </script>
