<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Pelican Riding Bicycle</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom, #87CEEB, #98D8E8);
            font-family: Arial, sans-serif;
        }

        .scene {
            position: relative;
            width: 400px;
            height: 300px;
        }

        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 100, 150, 0.6);
            border-radius: 0 0 10px 10px;
        }

        .sky {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .pelican {
            position: absolute;
            bottom: 70px;
            left: 50px;
            width: 80px;
            height: 60px;
            animation: flyForward 8s infinite linear;
            transform-origin: center;
        }

        @keyframes flyForward {
            0% {
                transform: translateX(0) translateY(0) rotate(0deg);
            }
            25% {
                transform: translateX(200px) translateY(-20px) rotate(-10deg);
            }
            50% {
                transform: translateX(400px) translateY(0) rotate(0deg);
            }
            75% {
                transform: translateX(600px) translateY(-15px) rotate(10deg);
            }
            100% {
                transform: translateX(800px) translateY(0) rotate(0deg);
            }
        }

        .bicycle {
            position: absolute;
            bottom: 70px;
            right: 50px;
            width: 100px;
            height: 50px;
            animation: moveWithPelican 8s infinite linear;
        }

        @keyframes moveWithPelican {
            0% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(-400px);
            }
            100% {
                transform: translateX(-800px);
            }
        }

        .pelican-body {
            position: absolute;
            width: 60px;
            height: 40px;
            background: #FF6B35;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            top: 10px;
            left: 10px;
        }

        .pelican-beak {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 8px solid #FFA500;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            top: 25px;
            right: -8px;
        }

        .pelican-eye {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            top: 20px;
            right: 5px;
        }

        .pelican-wing {
            position: absolute;
            width: 20px;
            height: 30px;
            background: #FF6B35;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            top: 20px;
            right: -20px;
            animation: wingFlap 1s infinite ease-in-out;
        }

        @keyframes wingFlap {
            0%, 100% {
                transform: rotate(-20deg);
            }
            50% {
                transform: rotate(20deg);
            }
        }

        .bicycle-frame {
            position: absolute;
            width: 70px;
            height: 4px;
            background: #333;
            top: 20px;
            left: 15px;
        }

        .bicycle-seat {
            position: absolute;
            width: 20px;
            height: 4px;
            background: #666;
            top: 15px;
            left: 35px;
            transform: rotate(15deg);
        }

        .bicycle-wheels {
            position: absolute;
            top: 16px;
            left: 10px;
            width: 50px;
            height: 30px;
        }

        .wheel {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid #333;
            border-radius: 50%;
        }

        .front-wheel {
            top: 0;
            left: 0;
        }

        .back-wheel {
            top: 0;
            right: 0;
        }

        .pedal {
            position: absolute;
            width: 3px;
            height: 15px;
            background: #444;
            top: 25px;
            left: 35px;
            animation: pedalRotate 1s infinite linear;
        }

        @keyframes pedalRotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .title {
            position: absolute;
            top: -50px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="title">Animated Pelican Riding a Bicycle! 🚴</div>
        <div class="sky"></div>
        <div class="water"></div>
        
        <div class="pelican">
            <div class="pelican-body"></div>
            <div class="pelican-beak"></div>
            <div class="pelican-eye"></div>
            <div class="pelican-wing"></div>
        </div>
        
        <div class="bicycle">
            <div class="bicycle-frame"></div>
            <div class="bicycle-seat"></div>
            <div class="bicycle-wheels">
                <div class="wheel front-wheel"></div>
                <div class="wheel back-wheel"></div>
            </div>
            <div class="pedal"></div>
        </div>
    </div>
</body>
</html>
