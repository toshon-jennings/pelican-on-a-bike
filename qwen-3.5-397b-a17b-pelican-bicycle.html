    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes ride {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(10px); }
        }
        @keyframes pedal {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
        }
        @keyframes wheel-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        @keyframes wing-flap {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }
        @keyframes beak-open {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.2); }
        }
        @keyframes cloud-move {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-200px); }
        }
        @keyframes road-move {
            0% { background-position: 0 0; }
            100% { background-position: -100px 0; }
        }
        .scene { perspective: 1000px; }
        .bicycle-container { animation: ride 0.3s ease-in-out infinite, bob 0.3s ease-in-out infinite; }
        .wheel { animation: wheel-spin 0.8s linear infinite; transform-origin: center; }
        .pelican-body { animation: bob 0.3s ease-in-out infinite; }
        .pelican-wing { animation: wing-flap 0.4s ease-in-out infinite; transform-origin: top left; }
        .pelican-beak { animation: beak-open 0.5s ease-in-out infinite; transform-origin: left center; }
        .cloud { animation: cloud-move 20s linear infinite; }
        .cloud:nth-child(2) { animation-duration: 25s; animation-delay: -10s; }
        .cloud:nth-child(3) { animation-duration: 18s; animation-delay: -5s; }
        .road { animation: road-move 0.5s linear infinite; }
        .pedal { animation: pedal 0.4s linear infinite; transform-origin: center; }
    </style>
</head>

                <span id="btnText">Pause</span>
            </button>
            <button onclick="changeSpeed()" class="px-6 py-2 bg-green-500 text-white rounded-full font-bold hover:bg-green-600 transition shadow-lg">
                Speed: <span id="speedText">Normal</span>

    <script>
        let isAnimating = true;
        let speedMultiplier = 1;
        function toggleAnimation() {
            const bc = document.querySelector('.bicycle-container');
            const wheels = document.querySelectorAll('.wheel');
            const pedals = document.querySelectorAll('.pedal');
            const road = document.querySelector('.road');
            const btnText = document.getElementById('btnText');
            isAnimating = !isAnimating;
            if (isAnimating) {
                bc.style.animationPlayState = 'running';
                wheels.forEach(w => w.style.animationPlayState = 'running');
                pedals.forEach(p => p.style.animationPlayState = 'running');
                road.style.animationPlayState = 'running';
                btnText.textContent = 'Pause';
            } else {
                bc.style.animationPlayState = 'paused';
                wheels.forEach(w => w.style.animationPlayState = 'paused');
                pedals.forEach(p => p.style.animationPlayState = 'paused');
                road.style.animationPlayState = 'paused';
                btnText.textContent = 'Play';
            }
        }
        function changeSpeed() {
            const st = document.getElementById('speedText');
            const bc = document.querySelector('.bicycle-container');
            const wheels = document.querySelectorAll('.wheel');
            const pedals = document.querySelectorAll('.pedal');
            const road = document.querySelector('.road');
            const pw = document.querySelector('.pelican-wing');
            const pb = document.querySelector('.pelican-beak');
            if (speedMultiplier === 1) { speedMultiplier = 2; st.textContent = 'Fast'; }
            else if (speedMultiplier === 2) { speedMultiplier = 0.5; st.textContent = 'Slow'; }
            else { speedMultiplier = 1; st.textContent = 'Normal'; }
            bc.style.animationDuration = `${0.3 / speedMultiplier}s`;
            wheels.forEach(w => { w.style.animationDuration = `${0.8 / speedMultiplier}s`; });
            pedals.forEach(p => { p.style.animationDuration = `${0.4 / speedMultiplier}s`; });
            road.style.animationDuration = `${0.5 / speedMultiplier}s`;
            pw.style.animationDuration = `${0.4 / speedMultiplier}s`;
            pb.style.animationDuration = `${0.5 / speedMultiplier}s`;
        }
    </script>
