<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelican on a Bicycle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Comic Sans MS', cursive, sans-serif;
  }
  body {
    background: linear-gradient(180deg, #87ceeb 0%, #b0e0e6 55%, #98d8a8 55%, #7cb87a 100%);
    position: relative;
  }
  .sun {
    position: absolute;
    top: 60px;
    right: 120px;
    width: 90px;
    height: 90px;
    background: radial-gradient(circle, #fff89e 0%, #ffd54a 70%, #ffb300 100%);
    border-radius: 50%;
    box-shadow: 0 0 50px #ffeb3b, 0 0 100px #ffc107;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.9;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud-1 { width: 100px; height: 30px; top: 80px; left: -100px; animation: float 35s linear infinite; }
  .cloud-1::before { width: 50px; height: 50px; top: -25px; left: 15px; }
  .cloud-1::after  { width: 40px; height: 40px; top: -18px; left: 55px; }
  .cloud-2 { width: 130px; height: 35px; top: 160px; left: -200px; animation: float 50s linear infinite; animation-delay: -20s; }
  .cloud-2::before { width: 60px; height: 60px; top: -30px; left: 20px; }
  .cloud-2::after  { width: 50px; height: 50px; top: -22px; left: 70px; }
  .cloud-3 { width: 80px; height: 25px; top: 40px; left: -150px; animation: float 60s linear infinite; animation-delay: -10s; }
  .cloud-3::before { width: 40px; height: 40px; top: -20px; left: 10px; }
  .cloud-3::after  { width: 35px; height: 35px; top: -16px; left: 45px; }
  @keyframes float {
    from { transform: translateX(0); }
    to   { transform: translateX(140vw); }
  }
  .hills {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45%;
    pointer-events: none;
  }
  .road {
    position: absolute;
    bottom: 80px;
    left: 0;
    width: 100%;
    height: 14px;
    background: #333;
    border-top: 2px solid #555;
    border-bottom: 2px solid #555;
  }
  .road::before {
    content: '';
    position: absolute;
    top: 50%; left: 0;
    width: 100%; height: 4px;
    transform: translateY(-50%);
    background: repeating-linear-gradient(90deg, #fff 0 30px, transparent 30px 60px);
    animation: roadMove 0.6s linear infinite;
  }
  @keyframes roadMove {
    from { background-position: 0 0; }
    to   { background-position: -60px 0; }
  }
  .scene {
    position: absolute;
    bottom: 80px;
    left: 0;
    width: 280px;
    height: 220px;
    animation: ride 8s linear infinite;
  }
  @keyframes ride {
    0%   { transform: translateX(-320px); }
    100% { transform: translateX(110vw); }
  }
  .scene svg { width: 100%; height: 100%; overflow: visible; }
  .wheel { transform-box: fill-box; transform-origin: center; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pedal-group { transform-box: fill-box; transform-origin: center; animation: spin 0.8s linear infinite; }
  .pelican {
    transform-box: fill-box;
    transform-origin: center;
    animation: bob 0.8s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-2px) rotate(-1deg); }
    75% { transform: translateY(-2px) rotate(1deg); }
  }
  .wing {
    transform-box: fill-box;
    transform-origin: 0% 80%;
    animation: flap 0.4s ease-in-out infinite alternate;
  }
  @keyframes flap {
    from { transform: rotate(-10deg); }
    to   { transform: rotate(25deg); }
  }
  .tail {
    transform-box: fill-box;
    transform-origin: 0% 50%;
    animation: wag 0.4s ease-in-out infinite alternate;
  }
  @keyframes wag {
    from { transform: rotate(-5deg); }
    to   { transform: rotate(8deg); }
  }
  .pouch {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: wobble 1.6s ease-in-out infinite;
    transform-origin: 50% 0%;
  }
  @keyframes wobble {
    0%, 100% { transform: scaleY(1) rotate(0deg); }
    50% { transform: scaleY(1.05) rotate(2deg); }
  }
  .title {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    color: #2c3e50;
    text-shadow: 2px 2px 0 #fff, 4px 4px 8px rgba(0,0,0,0.2);
    letter-spacing: 2px;
    z-index: 10;
  }
  .grass {
    position: absolute;
    bottom: 88px;
    width: 8px;
    height: 12px;
    background: #4a7c3a;
    border-radius: 50% 50% 0 0;
    animation: grassMove 0.3s linear infinite;
  }
  @keyframes grassMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-100vw); }
  }
</style>
</head>
<body>
<div class="title">🚲 Pelican on a Bike 🪶</div>
<div class="sun"></div>
<div class="cloud cloud-1"></div>
<div class="cloud cloud-2"></div>
<div class="cloud cloud-3"></div>
<svg class="hills" viewBox="0 0 1000 400" preserveAspectRatio="none">
  <path d="M0,250 Q200,150 400,220 T800,200 T1000,230 L1000,400 L0,400 Z" fill="#6b9e5e"/>
  <path d="M0,300 Q150,230 350,280 T700,270 T1000,290 L1000,400 L0,400 Z" fill="#5a8a4d"/>

    <g stroke="#c0392b" stroke-width="5" fill="none" stroke-linecap="round">
      <line x1="80"  y1="150" x2="140" y2="100"/>

      </g>
      <g class="wing" style="transform-origin: 100px 80px;">
        <path d="M100,75 Q120,70 135,82 Q130,95 110,95 Q100,92 100,75 Z" fill="#d6d6d6" stroke="#222" stroke-width="1.5"/>
        <line x1="105" y1="80" x2="130" y2="82" stroke="#888" stroke-width="1"/>
        <line x1="105" y1="86" x2="128" y2="88" stroke="#888" stroke-width="1"/>
      </g>

        <path d="M178,46 Q195,60 200,55 Q200,48 195,46 Z" fill="#ffb84d" stroke="#222" stroke-width="1.5"/>
      </g>
      <line x1="105" y1="105" x2="125" y2="135" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>
      <line x1="118" y1="105" x2="145" y2="135" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>

    <g stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7">
      <line x1="20" y1="100" x2="40" y2="100">
        <animate attributeName="x1" values="20;0" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="40;20" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line x1="10" y1="120" x2="35" y2="120">
        <animate attributeName="x1" values="10;-10" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="35;15" dur="0.5s" repeatCount="indefinite"/>
      </line>
    </g>
  </svg>
</div>

<div class="grass" style="left: 25%; animation-delay: -0.1s;"></div>
<div class="grass" style="left: 40%; animation-delay: -0.2s;"></div>
<div class="grass" style="left: 55%; animation-delay: -0.15s;"></div>
<div class="grass" style="left: 70%; animation-delay: -0.25s;"></div>
<div class="grass" style="left: 85%; animation-delay: -0.05s;"></div>
<script>
  const body = document.body;
  for (let i = 0; i < 30; i++) {
    const g = document.createElement('div');
    g.className = 'grass';
    g.style.left = (Math.random() * 100) + '%';
    g.style.animationDelay = (-Math.random() * 0.3) + 's';
    g.style.opacity = 0.6 + Math.random() * 0.4;
    body.appendChild(g);
  }
</script>
