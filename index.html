<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A growing gallery of AI models attempting one gloriously specific challenge: animate a pelican riding a bicycle.">
  <title>Pelicans On Bikes</title>
  <link rel="icon" href="assets/pelicans-on-bikes-mark.jpeg" type="image/jpeg">
  <link rel="apple-touch-icon" href="assets/pelicans-on-bikes-mark.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f1e3;
      --ink: #073b35;
      --ink-soft: #315c54;
      --brand-blue: #56758b;
      --brand-blue-soft: #c9d6df;
      --sea: #8dc9c0;
      --sea-light: #d5ece4;
      --coral: #e8583e;
      --sun: #f5b82e;
      --line: rgba(7, 59, 53, 0.28);
      --display: "Oswald", "Arial Narrow", sans-serif;
      --body: "DM Sans", system-ui, sans-serif;
      --max-width: 1400px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        radial-gradient(circle at 12% 20%, rgba(7, 59, 53, 0.035) 0 1px, transparent 1.5px),
        radial-gradient(circle at 74% 62%, rgba(86, 117, 139, 0.05) 0 1px, transparent 1.6px);
      background-size: 11px 13px, 17px 19px;
      font-family: var(--body);
      overflow-x: hidden;
    }

    a {
      color: inherit;
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      top: 0.75rem;
      left: 0.75rem;
      padding: 0.75rem 1rem;
      color: var(--paper);
      background: var(--ink);
      transform: translateY(-160%);
      transition: transform 180ms ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .site-header,
    .hero,
    .lineup-inner,
    .footer-inner {
      width: min(calc(100% - 3rem), var(--max-width));
      margin-inline: auto;
    }

    .site-header {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 104px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      position: relative;
      isolation: isolate;
      display: block;
      width: 76px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--paper);
      box-shadow: 0 0 0 2px var(--ink);
      text-decoration: none;
      overflow: hidden;
      transition: transform 180ms ease;
    }

    .brand:hover,
    .brand:focus-visible {
      transform: translateY(-2px) rotate(-3deg) scale(1.03);
    }

    .brand img {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      object-fit: cover;
      transform-origin: center;
      animation: logo-mark-spin 10s linear infinite;
    }

    .brand:hover img,
    .brand:focus-visible img {
      animation-duration: 1.15s;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: clamp(1.25rem, 3vw, 3rem);
      font: 600 1rem/1 var(--display);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .site-nav a {
      position: relative;
      padding-block: 0.75rem;
      text-decoration: none;
    }

    .site-nav a::after {
      position: absolute;
      right: 0;
      bottom: 0.35rem;
      left: 0;
      height: 3px;
      content: "";
      background: var(--brand-blue);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 180ms ease;
    }

    .site-nav a:hover::after,
    .site-nav a:focus-visible::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(580px, 1.1fr);
      align-items: center;
      min-height: calc(100svh - 104px);
      padding: 3.5rem 0 5.5rem;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      align-self: center;
      padding-bottom: 2rem;
    }

    h1 {
      max-width: 7.7ch;
      font: 700 clamp(5.25rem, 10.5vw, 10.5rem)/0.82 var(--display);
      letter-spacing: -0.065em;
      text-transform: uppercase;
      text-wrap: balance;
    }

    h1 span {
      display: block;
    }

    .hero-copy::after {
      display: block;
      width: min(100%, 34rem);
      height: 5px;
      margin: 1.6rem 0 1.15rem;
      content: "";
      background: linear-gradient(90deg, var(--coral) 0 62%, var(--brand-blue) 62% 100%);
      transform: rotate(-0.5deg);
    }

    .hero-copy p {
      max-width: 30rem;
      font: 600 clamp(1.2rem, 2vw, 1.65rem)/1.35 Georgia, serif;
      letter-spacing: 0.01em;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.8rem;
      padding: 1rem 1.35rem;
      border: 2px solid var(--ink);
      color: var(--paper);
      background: var(--coral);
      box-shadow: 5px 5px 0 var(--ink);
      font: 600 1rem/1 var(--display);
      letter-spacing: 0.07em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .cta:hover,
    .cta:focus-visible {
      box-shadow: 2px 2px 0 var(--ink);
      transform: translate(3px, 3px);
    }

    .cta svg,
    .rider-action svg,
    .footer-link svg {
      width: 1.15em;
      height: 1.15em;
      transition: transform 160ms ease;
    }

    .cta:hover svg,
    .rider:hover .rider-action svg,
    .footer-link:hover svg {
      transform: translateX(4px);
    }

    .ride-stage {
      position: relative;
      align-self: stretch;
      min-height: 590px;
      margin-right: calc((100vw - min(100vw - 3rem, var(--max-width))) / -2);
      overflow: hidden;
      isolation: isolate;
    }

    .sun {
      position: absolute;
      z-index: -2;
      top: 8%;
      right: 14%;
      width: clamp(150px, 17vw, 260px);
      aspect-ratio: 1;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--sun);
      box-shadow: 12px 12px 0 rgba(7, 59, 53, 0.08);
    }

    .cloud {
      position: absolute;
      z-index: -1;
      color: var(--sea);
      opacity: 0.62;
      animation: drift 16s linear infinite;
    }

    .cloud::before,
    .cloud::after {
      position: absolute;
      bottom: 0;
      content: "";
      border-radius: 999px 999px 0 0;
      background: currentColor;
    }

    .cloud::before {
      left: 25%;
      width: 38%;
      height: 155%;
    }

    .cloud::after {
      right: 14%;
      width: 30%;
      height: 110%;
    }

    .cloud-one {
      top: 25%;
      right: 5%;
      width: 180px;
      height: 34px;
      border-radius: 999px;
      background: currentColor;
    }

    .cloud-two {
      top: 41%;
      left: 2%;
      width: 120px;
      height: 24px;
      border-radius: 999px;
      background: currentColor;
      animation-delay: -8s;
      animation-duration: 20s;
    }

    .road {
      position: absolute;
      z-index: -1;
      right: -12%;
      bottom: 2%;
      width: 112%;
      height: 34%;
      border: 3px solid var(--ink);
      border-radius: 50% 0 0 0;
      background:
        repeating-linear-gradient(
          98deg,
          transparent 0 70px,
          var(--paper) 70px 132px,
          transparent 132px 230px
        ),
        var(--ink);
      background-position: 0 0;
      transform: rotate(-3deg) skewX(-5deg);
      animation: road-lines 1.2s linear infinite;
    }

    .road::after {
      position: absolute;
      top: -24px;
      right: 0;
      left: 0;
      height: 14px;
      border-top: 3px solid var(--ink);
      border-bottom: 3px solid var(--ink);
      content: "";
      background: var(--sea);
    }

    .rider-motion {
      position: absolute;
      right: clamp(0rem, 4vw, 5rem);
      bottom: 13%;
      width: min(94%, 760px);
      transform-origin: 50% 70%;
      animation: ride-bob 0.55s ease-in-out infinite alternate;
    }

    .rider-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      filter: drop-shadow(10px 14px 0 rgba(7, 59, 53, 0.08));
    }

    .wheel,
    .crank {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 1s linear infinite;
    }

    .front-leg,
    .back-leg {
      transform-box: view-box;
      transform-origin: 350px 236px;
    }

    .front-leg {
      animation: pedal-front 1s ease-in-out infinite;
    }

    .back-leg {
      animation: pedal-back 1s ease-in-out infinite;
    }

    .scarf-tail {
      transform-box: fill-box;
      transform-origin: right center;
      animation: scarf 0.8s ease-in-out infinite alternate;
    }

    .wing {
      transform-box: fill-box;
      transform-origin: 93% 15%;
      animation: wing 1.1s ease-in-out infinite alternate;
    }

    .speed-line {
      opacity: 0;
      animation: speed-line 1.2s linear infinite;
    }

    .speed-line:nth-child(2) {
      animation-delay: -0.4s;
    }

    .speed-line:nth-child(3) {
      animation-delay: -0.8s;
    }

    .lineup {
      position: relative;
      padding: clamp(5rem, 9vw, 9rem) 0 6rem;
      border-top: 3px solid var(--ink);
    }

    .lineup::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 9px;
      content: "";
      background: linear-gradient(90deg, var(--coral) 0 33%, var(--sun) 33% 66%, var(--brand-blue) 66%);
    }

    .lineup-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.65fr);
      align-items: end;
      gap: 3rem;
      margin-bottom: clamp(3rem, 6vw, 5.5rem);
    }

    .lineup h2 {
      font: 700 clamp(4.5rem, 9vw, 9rem)/0.85 var(--display);
      letter-spacing: -0.055em;
      text-transform: uppercase;
    }

    .lineup-copy {
      max-width: 33rem;
      padding-bottom: 0.55rem;
      font: 600 clamp(1.15rem, 1.8vw, 1.5rem)/1.4 Georgia, serif;
    }

    .rider-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-top: 1px solid var(--ink);
      border-left: 1px solid var(--ink);
    }

    .rider {
      --accent: var(--coral);
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      min-height: 112px;
      padding: 1.3rem 1.5rem 1.25rem 1.75rem;
      border-right: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      text-decoration: none;
      overflow: hidden;
      transition: color 180ms ease, background-color 180ms ease;
    }

    .rider::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 7px;
      content: "";
      background: var(--accent);
      transition: width 180ms ease;
    }

    .rider::after {
      position: absolute;
      z-index: -1;
      top: 50%;
      right: 10%;
      width: 120px;
      height: 120px;
      border: 2px solid currentColor;
      border-radius: 50%;
      content: "";
      opacity: 0.08;
      transform: translateY(-50%);
      transition: transform 450ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 180ms ease;
    }

    .rider:hover,
    .rider:focus-visible {
      color: var(--paper);
      background: var(--ink);
    }

    .rider:hover::before,
    .rider:focus-visible::before {
      width: 13px;
    }

    .rider:hover::after,
    .rider:focus-visible::after {
      opacity: 0.18;
      transform: translate(22px, -50%) rotate(180deg);
    }

    .rider-name {
      display: block;
      font: 600 clamp(1.45rem, 2.2vw, 2rem)/1.1 var(--display);
      letter-spacing: -0.02em;
    }

    .rider-file {
      display: block;
      max-width: 40ch;
      margin-top: 0.45rem;
      color: var(--ink-soft);
      font: 500 0.72rem/1.35 var(--body);
      overflow-wrap: anywhere;
      transition: color 180ms ease;
    }

    .rider:hover .rider-file,
    .rider:focus-visible .rider-file {
      color: var(--sea-light);
    }

    .rider-action {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      margin-left: 1rem;
      color: var(--accent);
      font: 600 0.86rem/1 var(--display);
      letter-spacing: 0.055em;
      text-transform: uppercase;
    }

    footer {
      position: relative;
      color: var(--paper);
      background: var(--ink);
      overflow: hidden;
    }

    footer::before {
      position: absolute;
      right: -4rem;
      bottom: -7rem;
      width: 22rem;
      aspect-ratio: 1;
      border: 2px solid rgba(247, 241, 227, 0.18);
      border-radius: 50%;
      content: "";
      box-shadow:
        0 0 0 1.75rem rgba(247, 241, 227, 0.04),
        0 0 0 3.5rem rgba(247, 241, 227, 0.04);
    }

    .footer-inner {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      min-height: 210px;
      padding-block: 3rem;
    }

    .footer-phrase {
      max-width: 22ch;
      font: 600 clamp(1.8rem, 3.5vw, 3.25rem)/1.1 Georgia, serif;
    }

    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      padding-bottom: 0.35rem;
      border-bottom: 3px solid var(--coral);
      font: 600 1rem/1 var(--display);
      letter-spacing: 0.05em;
      text-decoration: none;
      text-transform: uppercase;
    }

    :focus-visible {
      outline: 3px solid var(--sun);
      outline-offset: 4px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes logo-mark-spin {
      from { transform: scale(1.18) rotate(0); }
      to { transform: scale(1.18) rotate(1turn); }
    }

    @keyframes ride-bob {
      from { transform: translateY(0) rotate(-0.35deg); }
      to { transform: translateY(-7px) rotate(0.45deg); }
    }

    @keyframes pedal-front {
      0%, 100% { transform: rotate(9deg); }
      50% { transform: rotate(-9deg); }
    }

    @keyframes pedal-back {
      0%, 100% { transform: rotate(-9deg); }
      50% { transform: rotate(9deg); }
    }

    @keyframes scarf {
      from { transform: rotate(-5deg) skewX(0); }
      to { transform: rotate(6deg) skewX(7deg); }
    }

    @keyframes wing {
      from { transform: rotate(-1deg); }
      to { transform: rotate(4deg); }
    }

    @keyframes drift {
      from { transform: translateX(70px); }
      to { transform: translateX(-100px); }
    }

    @keyframes road-lines {
      to { background-position: -230px 0; }
    }

    @keyframes speed-line {
      0% { opacity: 0; transform: translateX(50px); }
      30% { opacity: 0.55; }
      100% { opacity: 0; transform: translateX(-160px); }
    }

    @media (max-width: 1080px) {
      .hero {
        grid-template-columns: 0.8fr 1.2fr;
      }

      h1 {
        font-size: clamp(4.7rem, 10vw, 7rem);
      }

      .ride-stage {
        min-height: 520px;
      }

      .rider-list {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 800px) {
      .site-header,
      .hero,
      .lineup-inner,
      .footer-inner {
        width: min(calc(100% - 2rem), var(--max-width));
      }

      .site-header {
        height: 84px;
      }

      .brand {
        width: 60px;
      }

      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding-top: 3.5rem;
      }

      .hero-copy {
        padding-bottom: 0;
      }

      h1 {
        max-width: 7ch;
        font-size: clamp(4.75rem, 23vw, 8rem);
      }

      .ride-stage {
        min-height: 510px;
        margin: -2rem -1rem 0;
      }

      .rider-motion {
        right: -3%;
        bottom: 12%;
        width: min(105%, 720px);
      }

      .road {
        right: -25%;
        width: 130%;
      }

      .lineup-heading {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .lineup h2 {
        font-size: clamp(4rem, 20vw, 7rem);
      }
    }

    @media (max-width: 540px) {
      .site-nav {
        gap: 1rem;
        font-size: 0.82rem;
      }

      .site-nav a:first-child {
        display: none;
      }

      .hero {
        padding-top: 2.5rem;
      }

      .hero-copy p {
        font-size: 1.12rem;
      }

      .ride-stage {
        min-height: 380px;
      }

      .sun {
        top: 16%;
        right: 8%;
        width: 132px;
      }

      .cloud {
        display: none;
      }

      .rider {
        grid-template-columns: 1fr;
        min-height: 118px;
        padding-right: 1.25rem;
      }

      .rider-action {
        margin: 0.8rem 0 0;
      }

      .footer-inner {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#lineup">Skip to the riders</a>

  <header class="site-header">
    <a class="brand" href="#" aria-label="Pelicans On Bikes home">
      <img src="assets/pelicans-on-bikes-mark.jpeg" alt="" width="1024" height="1024">
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="#lineup">The lineup</a>
      <a href="https://github.com/toshon-jennings/pelican-on-a-bike" target="_blank" rel="noreferrer">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title"><span>Pelicans</span> <span>On Bikes</span></h1>
        <p>One weird prompt. Endless wildly different rides.</p>
        <a class="cta" href="#lineup">
          Meet the riders
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14M14 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <div class="ride-stage" aria-hidden="true">
        <div class="sun"></div>
        <div class="cloud cloud-one"></div>
        <div class="cloud cloud-two"></div>
        <div class="road"></div>
        <div class="rider-motion">
          <!--
            One coordinate system, no mirroring: the rider travels toward +x.
            Rear hub 196,402 · bottom bracket 346,402 · front hub 556,402.
            Saddle sits over the rear wheel, bars over the front, and every
            limb, the beak, the cap brim and the scarf are drawn to match.
          -->
          <svg class="rider-svg" viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg">
            <!-- wind streaks trail behind, to the left -->
            <g fill="none" stroke="#073b35" stroke-width="5" stroke-linecap="round">
              <path class="speed-line" d="M56 214h96"/>
              <path class="speed-line" d="M24 262h118"/>
              <path class="speed-line" d="M70 306h82"/>
            </g>

            <g class="wheel">
              <circle cx="196" cy="402" r="100" fill="#f7f1e3" stroke="#073b35" stroke-width="11"/>
              <circle cx="196" cy="402" r="82" fill="none" stroke="#073b35" stroke-width="2"/>
              <g stroke="#073b35" stroke-width="2" opacity="0.72">
                <path d="M196 320v164M114 402h164M138 344l116 116M138 460l116-116"/>
              </g>
              <circle cx="196" cy="402" r="9" fill="#e8583e" stroke="#073b35" stroke-width="5"/>
            </g>

            <g class="wheel">
              <circle cx="556" cy="402" r="100" fill="#f7f1e3" stroke="#073b35" stroke-width="11"/>
              <circle cx="556" cy="402" r="82" fill="none" stroke="#073b35" stroke-width="2"/>
              <g stroke="#073b35" stroke-width="2" opacity="0.72">
                <path d="M556 320v164M474 402h164M498 344l116 116M498 460l116-116"/>
              </g>
              <circle cx="556" cy="402" r="9" fill="#e8583e" stroke="#073b35" stroke-width="5"/>
            </g>

            <!-- drivetrain: chainring forward of the rear cog -->
            <g fill="none" stroke="#073b35" stroke-width="5" stroke-linecap="round" opacity="0.85">
              <path d="M346 380 198 390"/>
              <path d="M346 424 198 414"/>
            </g>

            <!-- far leg: knee raised and forward, pedal at the top of the stroke -->
            <g class="back-leg">
              <path d="M348 236C364 266 378 292 376 318 374 344 350 364 320 374" fill="none" stroke="#073b35" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M348 236C364 266 378 292 376 318 374 344 350 364 320 374" fill="none" stroke="#c98f1c" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M304 374h34" fill="none" stroke="#073b35" stroke-width="13" stroke-linecap="round"/>
              <path d="M306 374h30" fill="none" stroke="#c98f1c" stroke-width="6" stroke-linecap="round"/>
            </g>

            <!-- frame: rear triangle, main triangle, fork, stem, bars, saddle -->
            <g fill="none" stroke="#073b35" stroke-linecap="round" stroke-linejoin="round">
              <path d="M196 402h150l-46-154Z" stroke-width="13"/>
