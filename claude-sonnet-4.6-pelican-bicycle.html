<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pelican on a Bicycle</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(180deg, #87CEEB 0%, #b0e0ff 60%, #c8f0a0 60%, #8BC34A 100%);
      height: calc(100vh - var(--pob-nav-h));
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      font-family: sans-serif;
    }
    .sun {
      position: absolute;
      top: 40px;
      right: 120px;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, #FFE066 60%, #FFD700 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px 15px #ffe06688;
      animation: sunPulse 3s ease-in-out infinite;
    }
    @keyframes sunPulse {
      0%, 100% { box-shadow: 0 0 40px 15px #ffe06688; }
      50% { box-shadow: 0 0 60px 30px #ffe066aa; }
    }
    .cloud {
      position: absolute;
      background: white;
      border-radius: 50px;
      opacity: 0.9;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .cloud1 { width: 120px; height: 38px; top: 60px; left: 80px; animation: cloudMove 18s linear infinite; }
    .cloud1::before { width: 60px; height: 60px; top: -28px; left: 20px; }
    .cloud1::after  { width: 45px; height: 45px; top: -18px; left: 55px; }
    .cloud2 { width: 90px; height: 28px; top: 110px; left: 340px; animation: cloudMove 25s linear infinite; opacity: 0.7; }
    .cloud2::before { width: 44px; height: 44px; top: -22px; left: 12px; }
    .cloud2::after  { width: 34px; height: 34px; top: -14px; left: 40px; }
    @keyframes cloudMove {
      0%   { transform: translateX(0); }
      100% { transform: translateX(110vw); }
    }
    .road {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: #555;
    }
    .road-line {
      position: absolute;
      top: 50%;
      left: -200px;
      width: 100px;
      height: 8px;
      background: #FFE066;
      border-radius: 4px;
      animation: roadScroll 0.7s linear infinite;
    }
    .road-line:nth-child(2) { left: calc(-200px + 260px); }
    .road-line:nth-child(3) { left: calc(-200px + 520px); }
    .road-line:nth-child(4) { left: calc(-200px + 780px); }
    .road-line:nth-child(5) { left: calc(-200px + 1040px); }
    .road-line:nth-child(6) { left: calc(-200px + 1300px); }
    .road-line:nth-child(7) { left: calc(-200px + 1560px); }
    @keyframes roadScroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(260px); }
    }
    .scene {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      animation: ride 3s ease-in-out infinite;
    }
    @keyframes ride {
      0%, 100% { transform: translateX(-50%) translateY(0px); }
      50%       { transform: translateX(-50%) translateY(-6px); }
    }
    svg {
      width: 380px;
      height: 340px;
      overflow: visible;
    }
    .wheel-group {
      transform-origin: center;
    }
    #wheel-front { animation: spinWheel 0.55s linear infinite; transform-origin: 275px 238px; }
    #wheel-back  { animation: spinWheel 0.55s linear infinite; transform-origin: 105px 238px; }
    @keyframes spinWheel {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    #pedal-group { animation: pedalSpin 0.55s linear infinite; transform-origin: 190px 218px; }
    @keyframes pedalSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    #wing-left  { animation: wingFlapL 0.7s ease-in-out infinite; transform-origin: 178px 148px; }
    #wing-right { animation: wingFlapR 0.7s ease-in-out infinite; transform-origin: 178px 148px; }
    @keyframes wingFlapL {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(-22deg); }
    }
    @keyframes wingFlapR {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(22deg); }
    }
    #beak { animation: beakBob 1.1s ease-in-out infinite; transform-origin: 170px 80px; }
    @keyframes beakBob {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(8deg); }
    }
    #eye-blink { animation: blink 3.5s ease-in-out infinite; }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95%            { transform: scaleY(0.07); }
    }
    #pouch { animation: pouchWobble 0.55s ease-in-out infinite; transform-origin: 205px 100px; }
    @keyframes pouchWobble {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(4deg); }
    }
    #leg-right { animation: legRight 0.55s linear infinite; transform-origin: 190px 185px; }
    #leg-left  { animation: legLeft  0.55s linear infinite; transform-origin: 190px 185px; }
    @keyframes legRight {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes legLeft {
      0%   { transform: rotate(180deg); }
      100% { transform: rotate(540deg); }
    }
  </style>
</head>
