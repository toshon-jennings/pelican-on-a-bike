<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelican Riding a Bicycle</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(180deg, #87CEEB 0%, #B0E0FF 40%, #90C965 40%, #5A9E2F 100%);
        }
        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.9;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud1 {
            width: 120px; height: 50px;
            top: 8%; left: -150px;
            animation: cloudMove 25s linear infinite;
        }
        .cloud1::before { width: 70px; height: 70px; top: -35px; left: 15px; }
        .cloud1::after { width: 90px; height: 60px; top: -25px; left: 50px; }
        .cloud2 {
            width: 100px; height: 40px;
            top: 15%; left: -120px;
            animation: cloudMove 30s linear infinite 5s;
        }
        .cloud2::before { width: 60px; height: 55px; top: -30px; left: 10px; }
        .cloud2::after { width: 75px; height: 50px; top: -20px; left: 40px; }
        .cloud3 {
            width: 140px; height: 55px;
            top: 5%; left: -170px;
            animation: cloudMove 35s linear infinite 12s;
        }
        .cloud3::before { width: 80px; height: 75px; top: -40px; left: 20px; }
        .cloud3::after { width: 100px; height: 65px; top: -30px; left: 60px; }
        @keyframes cloudMove {
            from { transform: translateX(0); }
            to { transform: translateX(calc(100vw + 300px)); }
        }
        .ground-line {
            position: absolute;
            bottom: 28%;
            left: 0;
            width: 100%;
            height: 3px;
            background: #4A7A20;
        }
        .road {
            position: absolute;
            bottom: 22%;
            left: 0;
            width: 100%;
            height: 8%;
            background: #555;
            border-top: 3px solid #777;
            border-bottom: 3px solid #444;
        }
        .road-markings {
            position: absolute;
            top: 45%;
            left: 0;
            width: 200%;
            height: 4px;
            background: repeating-linear-gradient(90deg, #FFD700 0px, #FFD700 40px, transparent 40px, transparent 80px);
            animation: roadScroll 1s linear infinite;
        }
        @keyframes roadScroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        .grass {
            position: absolute;
            bottom: 30%;
            left: 0;
            width: 100%;
            height: 4%;
            background: #6DB83A;
        }
        .bike-pelican {
            position: absolute;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
        }
        .wheel {
            animation: wheelSpin 0.8s linear infinite;
            transform-origin: center;
        }
        @keyframes wheelSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .pedal-group {
            animation: pedalSpin 0.8s linear infinite;
            transform-origin: center;
        }
        @keyframes pedalSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .pelican-body {
            animation: pelicanBob 0.4s ease-in-out infinite alternate;
        }
        @keyframes pelicanBob {
            0% { transform: translateY(0); }
            100% { transform: translateY(-3px); }
        }
        .leg-left {
            animation: legPedalLeft 0.8s ease-in-out infinite;
            transform-origin: 245px 200px;
        }
        .leg-right {
            animation: legPedalRight 0.8s ease-in-out infinite;
            transform-origin: 245px 200px;
        }
        @keyframes legPedalLeft {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-20deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes legPedalRight {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(20deg); }
            100% { transform: rotate(0deg); }
        }
        .wing {
            animation: wingFlap 0.6s ease-in-out infinite alternate;
            transform-origin: 220px 140px;
        }
        @keyframes wingFlap {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-15deg); }
        }
        .pouch {
            animation: pouchWobble 0.5s ease-in-out infinite alternate;
        }
        @keyframes pouchWobble {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(1.08); }
        }
        .eye-lid {
            animation: blink 3s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(0); }
            95% { transform: scaleY(1); }
        }
        .sun {
            position: absolute;
            top: 5%;
            right: 10%;
            width: 80px;
            height: 80px;
            background: #FFD700;
            border-radius: 50%;
            box-shadow: 0 0 40px #FFD700, 0 0 80px rgba(255, 215, 0, 0.4);
            animation: sunPulse 3s ease-in-out infinite alternate;
        }
        @keyframes sunPulse {
            0% { box-shadow: 0 0 40px #FFD700, 0 0 80px rgba(255, 215, 0, 0.4); }
            100% { box-shadow: 0 0 60px #FFD700, 0 0 100px rgba(255, 215, 0, 0.5); }
        }
        .flower {
            position: absolute;
            bottom: 31%;
        }
        .flower-stem {
            width: 3px;
            height: 25px;
            background: #3A7D1E;
            margin: 0 auto;
        }
        .flower-head {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin: 0 auto;
            animation: flowerSway 2s ease-in-out infinite alternate;
        }
        @keyframes flowerSway {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }
        .title {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Georgia', serif;
            font-size: 2rem;
            color: #2C5F1A;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            white-space: nowrap;
            animation: titleFloat 3s ease-in-out infinite alternate;
        }
        @keyframes titleFloat {
            0% { transform: translateX(-50%) translateY(0); }
            100% { transform: translateX(-50%) translateY(-5px); }
        }
        .speed-lines {
            position: absolute;
            left: -60px;
            animation: speedDash 0.5s linear infinite;
        }
        @keyframes speedDash {
            0% { opacity: 0.6; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(-30px); }
        }
    </style>
</head>

    <script>
        const scene = document.querySelector('.scene');
        function createParticle() {
            const particle = document.createElement('div');
            const size = Math.random() * 4 + 2;
            particle.style.cssText = `
                position: absolute;
                width: ${size}px;
                height: ${size}px;
                background: rgba(255,255,255,${Math.random() * 0.4 + 0.2});
                border-radius: 50%;
                top: ${Math.random() * 40}%;
                left: -10px;
                pointer-events: none;
                animation: particleFloat ${Math.random() * 8 + 5}s linear forwards;
            `;
            scene.appendChild(particle);
            setTimeout(() => particle.remove(), 13000);
        }
        const style = document.createElement('style');
        style.textContent = `
            @keyframes particleFloat {
                0% { transform: translate(0, 0); opacity: 0; }
                10% { opacity: 1; }
                90% { opacity: 1; }
                100% { transform: translate(${window.innerWidth + 50}px, ${Math.random() > 0.5 ? '-' : ''}${Math.random() * 50}px); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
        setInterval(createParticle, 600);
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 5;
            const bikePelican = document.querySelector('.bike-pelican');
            bikePelican.style.transform = `translateX(calc(-50% + ${x}px)) translateY(${y}px)`;
        });
    </script>
